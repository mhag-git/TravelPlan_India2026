<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indienreise 2026 – Interaktive Routen- & Transferkarte</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.85);
            --bg-card-hover: rgba(51, 65, 85, 0.95);
            --border-color: rgba(255, 255, 255, 0.12);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #38bdf8;
            --accent-gold: #f59e0b;
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Sidebar Styling */
        #sidebar {
            width: 440px;
            min-width: 380px;
            max-width: 480px;
            height: 100%;
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            transition: all 0.3s ease;
        }

        .sidebar-header {
            padding: 24px 20px 16px 20px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
        }

        .sidebar-header .badge-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            background: linear-gradient(135deg, #f59e0b, #ec4899);
            color: #ffffff;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
        }

        .sidebar-header h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 700;
            line-height: 1.25;
            color: #ffffff;
            margin-bottom: 6px;
        }

        .sidebar-header p {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Trip Quick Stats */
        .trip-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 14px;
            padding: 10px;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .stat-box {
            text-align: center;
        }

        .stat-value {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-label {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        /* Navigation / Filter Controls */
        .filter-bar {
            display: flex;
            gap: 6px;
            padding: 12px 18px;
            background: rgba(15, 23, 42, 0.5);
            border-bottom: 1px solid var(--border-color);
            overflow-x: auto;
        }

        .filter-btn {
            background: rgba(51, 65, 85, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .filter-btn:hover {
            background: rgba(71, 85, 105, 0.8);
            color: #fff;
        }

        .filter-btn.active {
            background: var(--accent-primary);
            color: #0f172a;
            border-color: var(--accent-primary);
            font-weight: 700;
        }

        /* Scrollable Timeline Section */
        .timeline-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .timeline-container::-webkit-scrollbar {
            width: 6px;
        }

        .timeline-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* Timeline Item Card */
        .station-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            backdrop-filter: blur(8px);
        }

        .station-card:hover {
            background: var(--bg-card-hover);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .station-card.selected {
            border-color: var(--accent-primary);
            background: rgba(56, 189, 248, 0.12);
            box-shadow: 0 0 0 1px var(--accent-primary), 0 8px 25px rgba(56, 189, 248, 0.2);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .station-number-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 13px;
            color: #ffffff;
        }

        .station-title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .station-name {
            font-family: 'Outfit', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
        }

        .category-pill {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .station-date-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
        }

        .stay-duration {
            font-weight: 700;
            color: var(--accent-gold);
            background: rgba(245, 158, 11, 0.12);
            padding: 2px 7px;
            border-radius: 4px;
        }

        .hotel-info {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 12px;
            color: #e2e8f0;
            background: rgba(15, 23, 42, 0.5);
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .hotel-icon {
            font-size: 14px;
            color: #38bdf8;
            margin-top: 1px;
        }

        .hotel-name {
            font-weight: 600;
            color: #f1f5f9;
        }

        .highlights-list {
            list-style: none;
            font-size: 11.5px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .highlights-list li {
            position: relative;
            padding-left: 14px;
        }

        .highlights-list li::before {
            content: '•';
            position: absolute;
            left: 2px;
            color: var(--accent-primary);
            font-weight: bold;
        }

        /* Transfer Connector Banner between cards */
        .transfer-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            margin: -4px 10px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px dashed rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .transfer-divider-icon {
            font-size: 14px;
        }

        .transfer-divider .transfer-time {
            margin-left: auto;
            font-weight: 700;
            color: #38bdf8;
        }

        /* Map Canvas */
        #map {
            flex: 1;
            height: 100%;
            background: #0b1120;
            z-index: 1;
        }

        /* Custom Map Controls Overlay */
        .map-floating-overlay {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .floating-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            box-shadow: var(--shadow-lg);
            color: #fff;
        }

        .btn-group {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: #fff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #0369a1, #1d4ed8);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.8);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(71, 85, 105, 1);
        }

        /* Custom Marker Styling */
        .custom-map-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 14px;
            box-shadow: 0 0 0 3px #ffffff, 0 6px 16px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .custom-map-marker:hover {
            transform: scale(1.15);
            z-index: 1000 !important;
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            background: rgba(15, 23, 42, 0.95) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 14px !important;
            color: #f8fafc !important;
            box-shadow: var(--shadow-lg) !important;
            padding: 4px;
        }

        .leaflet-popup-content {
            margin: 12px 14px !important;
            line-height: 1.4 !important;
        }

        .leaflet-popup-tip {
            background: rgba(15, 23, 42, 0.95) !important;
        }

        .popup-station-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        .popup-title {
            font-family: 'Outfit', sans-serif;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .popup-dates {
            font-size: 12px;
            color: #38bdf8;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .popup-detail-row {
            font-size: 12px;
            color: #cbd5e1;
            margin: 4px 0;
        }

        .popup-transfer-box {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            padding: 8px;
            margin-top: 8px;
            font-size: 11px;
            color: #94a3b8;
            border-left: 3px solid #38bdf8;
        }

        /* Legend on Map */
        .map-legend {
            position: absolute;
            bottom: 24px;
            right: 20px;
            z-index: 1000;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 12px;
            color: #e2e8f0;
            box-shadow: var(--shadow-lg);
            max-width: 280px;
        }

        .legend-title {
            font-weight: 700;
            margin-bottom: 8px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 4px 0;
            font-size: 11.5px;
            color: #cbd5e1;
        }

        .legend-line {
            width: 20px;
            height: 3px;
            border-radius: 2px;
        }

        .legend-line.dashed {
            background: repeating-linear-gradient(90deg, #ec4899, #ec4899 4px, transparent 4px, transparent 8px);
        }

        .legend-line.solid-road {
            background: #10b981;
        }

        .legend-line.water-dash {
            background: repeating-linear-gradient(90deg, #06b6d4, #06b6d4 3px, transparent 3px, transparent 6px);
        }
    </style>
</head>

        // Initialize Map
        const map = L.map('map', {
            zoomControl: true,
            attributionControl: false
        }).setView([11.5, 76.5], 7);

        // Dark Theme Map Tiles (CartoDB Dark Matter / Voyager)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            subdomains: 'abcd'
        }).addTo(map);

        const markers = {};
        const polylineLayers = [];
        let tourInterval = null;
        let currentTourIdx = 0;

        // Render Routes / Transfers
        routes.forEach((route, idx) => {
            let polylineOptions = {
                color: route.color,
                weight: route.type === 'flight' ? 4 : 5,
                opacity: 0.85,
                lineCap: 'round',
                lineJoin: 'round'
            };

            if (route.dash !== '0') {
                polylineOptions.dashArray = route.dash;
            }

            // Draw curved line for flights or straight for road
            let coords = [route.from_coords, route.to_coords];
            if (route.type === 'flight') {
                // Create intermediate curve point for flight arc
                const lat1 = route.from_coords[0], lng1 = route.from_coords[1];
                const lat2 = route.to_coords[0], lng2 = route.to_coords[1];
                const midLat = (lat1 + lat2) / 2 + 0.4; // offset arc
                const midLng = (lng1 + lng2) / 2 - 0.4;
                coords = [route.from_coords, [midLat, midLng], route.to_coords];
            }

            const poly = L.polyline(coords, polylineOptions).addTo(map);
            poly.bindTooltip(`<b>${route.from} → ${route.to}</b><br>${route.mode} • ⏱️ ${route.duration}`, {
                sticky: true,
                className: 'route-tooltip'
            });
            polylineLayers.push(poly);
        });

        // Render Station Markers
        stations.forEach((st) => {
            const markerHtml = `
                <div class="custom-map-marker" style="width: 32px; height: 32px; background: ${st.color};">
                    ${st.num}
                </div>
            `;

            const icon = L.divIcon({
                className: 'leaflet-custom-div-icon',
                html: markerHtml,
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                popupAnchor: [0, -18]
            });

            const marker = L.marker([st.lat, st.lng], { icon: icon }).addTo(map);

            const popupContent = `
                <div>
                    <span class="popup-station-badge" style="background: ${st.color}25; color: ${st.color};">${st.badge}</span>
                    <div class="popup-title">Station ${st.num}: ${st.name}</div>
                    <div class="popup-dates">📅 ${st.date} (${st.nights})</div>
                    <div class="popup-detail-row">🏨 <b>Unterkunft:</b> ${st.hotel}</div>
                    <div class="popup-detail-row" style="margin-top: 6px; font-size: 11.5px; color: #94a3b8;">${st.tagline}</div>
                    <div class="popup-transfer-box">
                        <b>Nächster Transfer:</b> ${st.next_transfer}<br>
                        🚗 <i>${st.transfer_mode} (${st.transfer_time})</i>
                    </div>
                </div>
            `;

            marker.bindPopup(popupContent);
            marker.on('click', () => {
                selectStationCard(st.id);
            });
            markers[st.id] = marker;

        // Build Timeline Cards in Sidebar

        stations.forEach((st, idx) => {

            card.className = 'station-card';
            card.id = `card-${st.id}`;
            card.onclick = () => {
                focusStation(st.id);
            };

            card.innerHTML = `
                <div class="card-header">
                    <div class="station-title-group">
                        <div class="station-number-badge" style="background: ${st.color};">${st.num}</div>
                        <span class="station-name">${st.name}</span>
                    </div>
                    <span class="category-pill" style="background: ${st.color}22; color: ${st.color};">${st.badge}</span>
                </div>
                <div class="station-date-row">
                    <span>📅 ${st.date}</span>
                    <span class="stay-duration">${st.nights}</span>
                </div>
                <div class="hotel-info">
                    <span class="hotel-icon">🏨</span>
                    <div>
                        <div class="hotel-name">${st.hotel}</div>
                        <div style="font-size: 10.5px; color: #94a3b8;">${st.hotel_status}</div>
                    </div>
                </div>
                <ul class="highlights-list">
                    ${st.highlights.map(h => `<li>${h}</li>`).join('')}
                </ul>
            `;

            timelineList.appendChild(card);

            // Add Transfer Divider if not last station
            if (idx < stations.length - 1) {
                const divider = document.createElement('div');
                divider.className = 'transfer-divider';
                divider.innerHTML = `
                    <span class="transfer-divider-icon">➔</span>
                    <span><b>Transfer nach ${stations[idx + 1].name}:</b> ${st.transfer_mode}</span>
                    <span class="transfer-time">${st.transfer_time}</span>
                `;
                timelineList.appendChild(divider);
            }
        });

        function focusStation(id) {
            const st = stations.find(s => s.id === id);
            if (!st) return;

            map.flyTo([st.lat, st.lng], 10, {
                animate: true,
                duration: 1.2
            });

            markers[id].openPopup();
            selectStationCard(id);
        }

        function selectStationCard(id) {
            document.querySelectorAll('.station-card').forEach(c => c.classList.remove('selected'));
            const selectedCard = document.getElementById(`card-${id}`);
            if (selectedCard) {
                selectedCard.classList.add('selected');
                selectedCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function fitAllStations() {
            const group = new L.featureGroup(Object.values(markers));
            map.fitBounds(group.getBounds().pad(0.12));
        }

        function showAllRoute() {
            setActiveFilter(0);
            fitAllStations();
        }

        function focusKerala() {
            setActiveFilter(1);
            // Kerala bounds: Kochi, Munnar, Periyar, Alleppey, Marari
            map.flyTo([9.85, 76.65], 8.5, { animate: true, duration: 1.2 });
        }

        function focusWedding() {
            setActiveFilter(2);
            focusStation(2); // Bangalore
        }

        function focusGoa() {
            setActiveFilter(3);
            focusStation(1); // Goa
        }

        function setActiveFilter(btnIndex) {
            const btns = document.querySelectorAll('.filter-btn');
            btns.forEach((b, i) => {
                if (i === btnIndex) b.classList.add('active');
                else b.classList.remove('active');
            });
        }

        function toggleTour() {
            const btn = document.getElementById('tourBtn');
            if (tourInterval) {
                clearInterval(tourInterval);
                tourInterval = null;
                btn.innerHTML = '▶ Route abspielen';
                btn.classList.remove('btn-secondary');
                btn.classList.add('btn-primary');
            } else {
                btn.innerHTML = '⏸ Pausieren';
                btn.classList.remove('btn-primary');
                btn.classList.add('btn-secondary');
                
                focusStation(stations[currentTourIdx].id);
                tourInterval = setInterval(() => {
                    currentTourIdx = (currentTourIdx + 1) % stations.length;
                    focusStation(stations[currentTourIdx].id);
                }, 3500);
            }
        }

        // Initial view bounds on start
        window.onload = () => {
            fitAllStations();
        };
    </script>
